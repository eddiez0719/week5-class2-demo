services:
  app:
   image: "${DOCKER_IMAGE_NAME:-week5-class2-demo}:${TAG:-local}"
   ports:
      - "127.0.0.1:5000:5000"
   healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s